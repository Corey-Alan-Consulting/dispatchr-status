# =============================================================================
# Deploy the status-page Worker to Cloudflare.
# Replaces the Upptime Actions crons: checks now run on a Workers cron at the
# edge, so this workflow only runs when the worker itself changes.
# =============================================================================

name: Deploy Status Worker

on:
  push:
    branches: [master]
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-status.yml'
  workflow_dispatch:

concurrency:
  group: deploy-status
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Resolve KV namespace (created on first run)
        working-directory: worker
        env:
          WORKER_NAME: dispatchr-status
        run: |
          set -uo pipefail

          # wrangler titles the namespace after the BINDING — "HISTORY" — not
          # "<worker>-HISTORY" the way older versions did. Match either, so a
          # wrangler change in either direction cannot strand this again.
          #
          # This mismatch was present from the very first deploy and invisible
          # for 34 days: the token carried no Workers permission, so the job
          # died on the create and never reached the lookup that would also
          # have failed. Two independent bugs, one symptom.
          #
          # Output is no longer discarded. Suppressing it hid an
          # "Authentication error [code: 10000]" here, and then hid that the
          # namespace being created had a different title from the one being
          # looked for. "Already exists" is the only failure worth tolerating,
          # so everything is printed and the auth case is named explicitly.
          create_out="$(npx --yes wrangler@4 kv namespace create HISTORY 2>&1)" || true
          echo "$create_out"
          if echo "$create_out" | grep -qiE 'authentication error|code. 10000'; then
            echo "::error::Cloudflare rejected the API token. It needs Account > Workers Scripts:Edit and Workers KV Storage:Edit, plus Zone > Workers Routes:Edit for the custom domain declared in wrangler.toml."
            exit 1
          fi

          if ! list="$(npx --yes wrangler@4 kv namespace list)"; then
            echo "::error::could not list KV namespaces - the token cannot read Workers KV"
            exit 1
          fi

          id="$(echo "$list" | jq -r --arg bare HISTORY --arg prefixed "${WORKER_NAME}-HISTORY" '.[] | select(.title == $bare or .title == $prefixed) | .id' | head -1)"

          if [ -z "$id" ]; then
            echo "::error::no KV namespace titled HISTORY or ${WORKER_NAME}-HISTORY. Namespaces visible to this token are listed above."
            echo "$list"
            exit 1
          fi

          echo "resolved KV namespace $id"
          sed -i "s/__KV_ID__/$id/" wrangler.toml
      - name: Deploy
        working-directory: worker
        run: npx --yes wrangler@4 deploy
