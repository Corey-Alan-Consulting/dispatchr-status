# =============================================================================
# Deploy the status-page Worker to Cloudflare.
# Replaces the Upptime Actions crons: checks now run on a Workers cron at the
# edge, so this workflow only runs when the worker itself changes.
# =============================================================================

name: Deploy Status Worker

on:
  push:
    branches: [master]
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-status.yml'
  workflow_dispatch:

concurrency:
  group: deploy-status
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Resolve KV namespace (created on first run)
        working-directory: worker
        env:
          WORKER_NAME: dispatchr-status
        run: |
          set -uo pipefail

          # The namespace title MUST be worker-scoped, and the lookup must never
          # fall back to the bare binding name.
          #
          # Older wrangler auto-prefixed the worker name, so `create HISTORY`
          # produced "<worker>-HISTORY" and each Worker got its own store.
          # wrangler 4.151 titles it exactly what you pass, so `create HISTORY`
          # produces one account-global namespace called "HISTORY" — and both
          # status Workers resolved to it, shared a single KV store, and
          # overwrote each other's `latest` and `days` keys every minute. Both
          # status pages served the other site's probe results, alternating.
          #
          # So the name is passed explicitly. The positional argument is a
          # NAMESPACE NAME, not a binding (wrangler has a separate --binding
          # flag), so hyphens are fine; the binding stays "HISTORY" in
          # wrangler.toml and only the id is substituted below.
          NS_TITLE="${WORKER_NAME}-HISTORY"

          # Output is not discarded. Suppressing it hid an "Authentication
          # error [code: 10000]" for 34 days, and then hid that the namespace
          # being created was titled differently from the one looked for.
          # "Already exists" is the only failure worth tolerating.
          create_out="$(npx --yes wrangler@4 kv namespace create "$NS_TITLE" 2>&1)" || true
          echo "$create_out"
          if echo "$create_out" | grep -qiE 'authentication error|code. 10000'; then
            echo "::error::Cloudflare rejected the API token. It needs Account > Workers Scripts:Edit and Workers KV Storage:Edit, plus Zone > Workers Routes:Edit for the custom domain declared in wrangler.toml."
            exit 1
          fi

          if ! list="$(npx --yes wrangler@4 kv namespace list)"; then
            echo "::error::could not list KV namespaces - the token cannot read Workers KV"
            exit 1
          fi

          # Exact match only. Matching a bare "HISTORY" here is what made the
          # two Workers share one store; it must stay un-matchable.
          id="$(echo "$list" | jq -r --arg t "$NS_TITLE" '.[] | select(.title == $t) | .id' | head -1)"

          if [ -z "$id" ]; then
            echo "::error::no KV namespace titled $NS_TITLE. Namespaces visible to this token:"
            echo "$list"
            exit 1
          fi

          echo "resolved KV namespace $NS_TITLE -> $id"
          sed -i "s/__KV_ID__/$id/" wrangler.toml
      - name: Deploy
        working-directory: worker
        run: npx --yes wrangler@4 deploy
