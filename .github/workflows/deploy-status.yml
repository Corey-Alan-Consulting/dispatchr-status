# =============================================================================
# Deploy the status-page Worker to Cloudflare.
# Replaces the Upptime Actions crons: checks now run on a Workers cron at the
# edge, so this workflow only runs when the worker itself changes.
# =============================================================================

name: Deploy Status Worker

on:
  push:
    branches: [master]
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-status.yml'
  workflow_dispatch:

concurrency:
  group: deploy-status
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Resolve KV namespace (created on first run)
        working-directory: worker
        run: |
          npx --yes wrangler@4 kv namespace create HISTORY 2>/dev/null || true
          id=$(npx --yes wrangler@4 kv namespace list \
            | jq -r '.[] | select(.title == "dispatchr-status-HISTORY") | .id')
          if [ -z "$id" ]; then
            echo "::error::KV namespace dispatchr-status-HISTORY not found and could not be created"
            exit 1
          fi
          sed -i "s/__KV_ID__/$id/" wrangler.toml

      - name: Deploy
        working-directory: worker
        run: npx --yes wrangler@4 deploy
